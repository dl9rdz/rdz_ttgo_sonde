; Builds an ESP32 second-stage bootloader for boards with a 26 MHz crystal
; (used by [env:heltec] in the main platformio.ini).
;
; Why: on ESP32 the crystal frequency is configured by the bootloader, the app
; only reads the value the bootloader stored. The Arduino framework ships a
; prebuilt bootloader for 40 MHz, so CONFIG_XTAL_FREQ=26 in the app alone has
; no effect (WiFi does not work, all clocks run at 26/40 of the nominal rate).
;
; Rebuild (only needed after a framework/platform upgrade):
;   cd tools/bootloader-xtal26 && pio run
;   cp .pio/build/bootloader-xtal26/bootloader.bin prebuilt/bootloader-esp32-xtal26.bin

[env:bootloader-xtal26]
; keep in sync with the main platformio.ini
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.10.50/platform-espressif32.zip
board = ttgo-lora32-v21
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
