; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = RX_FSK
data_dir = RX_FSK/data
; plain "pio run" builds only the standard target; use "pio run -e heltec" for 26 MHz boards
default_envs = ttgo-lora32

[extra]
lib_deps_builtin =
;    src
lib_deps_external =
    olikraus/U8g2 
    stevemarple/MicroNMEA @ ^2.0.5
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/moononournation/Arduino_GFX#v1.6.5
    # https://github.com/theelims/PsychicMqttClient
    https://github.com/HeMan/async-mqtt-client
    # https://github.com/marvinroger/async-mqtt-client
lib_ignore =
  AsyncTCP-esphome

; Common settings, inherited by all [env:...] targets below
[env]
# PlatformIO currently has no direct support for Arduino-ISP 
# There is a modified version from tasmota that supports that... let's use this (this also saves some code space)
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.10.50/platform-espressif32.zip

; board = heltec_wifi_lora_32
board = ttgo-lora32-v21
board_build.filesystem = littlefs
board_build.littlefs_version = 2.0

framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	${extra.lib_deps_builtin}
	${extra.lib_deps_external}
	paulstoffregen/Time@^1.6.0
lib_ignore = 
	Time 
	AsyncTCP-esphome

custom_sdkconfig = '# CONFIG_BT_ENABLED is not set'

; Same as with ArduinoIDE. Saves around 27k code
build_flags = -DCORE_DEBUG_LEVEL=0 -fno-lto
build_unflags = -flto

; Add / remove the following two lines for separate fonts partition in flash
; after changes:
; - pio run --target=upload (uploads partition table)
; - pio run --target=uploadfs (uploads file system matching the new partition table)
; if enable also do:
; - pio run --target=uploadfonts (uploads fonts.bin created during the first pio run)
; Then everything should be "back to normal"
;
extra_scripts = 
	# scripts/force-buildfs.py
	scripts/pio-build-extension.py

board_build.partitions = partitions-rdz.csv


; Standard target: ESP32 boards with 40 MHz crystal (TTGO LoRa32, T-Beam, Heltec V2+, ...)
[env:ttgo-lora32]


; Old boards with a 26 MHz crystal (e.g. early Heltec WiFi LoRa 32 V1).
; Same as ttgo-lora32, only the crystal frequency differs. The Arduino core is
; rebuilt with this sdkconfig (custom_sdkconfig), so the first build takes a while.
; On ESP32 the bootloader sets up the crystal frequency, and the Arduino prebuilt
; bootloader is for 40 MHz only, so a 26 MHz bootloader is used instead
; (see tools/bootloader-xtal26). OTA does not update the bootloader: a board must
; be fully flashed once with this target.
[env:heltec]
board_build.arduino.custom_bootloader = ${PROJECT_DIR}/tools/bootloader-xtal26/prebuilt/bootloader-esp32-xtal26.bin
custom_sdkconfig =
	${env.custom_sdkconfig}
	CONFIG_XTAL_FREQ_26=y
	'# CONFIG_XTAL_FREQ_40 is not set'
	'# CONFIG_XTAL_FREQ_AUTO is not set'
	CONFIG_XTAL_FREQ=26
